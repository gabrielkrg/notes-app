[package]
name = "notes-rust"
version = "0.1.0"
description = "Notes desktop with a Rust filesystem and indexed search"
edition = "2021"
rust-version = "1.90"

[lib]
name = "notes_core"
path = "src/lib.rs"

[[bin]]
name = "notes-rust"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:keyring", "dep:open", "dep:tauri-plugin-single-instance"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
tempfile = "3"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tauri = { version = "2", features = [], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }
open = { version = "5", optional = true }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"], optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
